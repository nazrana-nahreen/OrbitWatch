<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a105c" />
      <stop offset="0.6" stop-color="#14072f" />
      <stop offset="1" stop-color="#0a0319" />
    </radialGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2a85" />
      <stop offset="0.5" stop-color="#b057fc" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Planet Gradient -->
    <linearGradient id="planetGrad" x1="20" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5c6a" />
      <stop offset="0.4" stop-color="#ff2a85" />
      <stop offset="1" stop-color="#581c87" />
    </linearGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="ringGrad" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4" />
      <stop offset="0.5" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#ffbe1a" />
    </linearGradient>

    <!-- Asteroid Glow Gradient -->
    <radialGradient id="astGrad" cx="48" cy="20" r="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="0.3" stop-color="#ffbe1a" />
      <stop offset="1" stop-color="#ff2a85" />
    </radialGradient>
  </defs>

  <!-- Circular Outer Badge with Neon Stroke -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="2.5" />

  <!-- Background Twinkling Stars -->
  <circle cx="16" cy="18" r="1.2" fill="#ffffff" opacity="0.8" />
  <circle cx="48" cy="46" r="1" fill="#ffeaa7" opacity="0.9" />
  <circle cx="20" cy="48" r="1.4" fill="#67e8f9" opacity="0.75" />
  <circle cx="46" cy="12" r="1.5" fill="#f43f5e" opacity="0.8" />

  <!-- Back Half of Orbital Ring -->
  <path d="M 12 39 C 14 26, 42 16, 52 25" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  <!-- Central Planet -->
  <circle cx="32" cy="32" r="14" fill="url(#planetGrad)" />
  
  <!-- Planet Crater Detail -->
  <circle cx="27" cy="28" r="3" fill="#3b0764" opacity="0.45" />
  <circle cx="36" cy="36" r="4" fill="#3b0764" opacity="0.35" />
  <circle cx="35" cy="25" r="1.8" fill="#3b0764" opacity="0.4" />

  <!-- Front Half of Orbital Ring -->
  <path d="M 52 25 C 50 38, 22 48, 12 39" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Orbiting Asteroid / Core with Glowing Trail -->
  <path d="M 40 18 Q 44 19 47 21" stroke="#ff5c6a" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <circle cx="48" cy="22" r="4.5" fill="url(#astGrad)" />
  <circle cx="49" cy="21" r="1.5" fill="#ffffff" />
</svg>
